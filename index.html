<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balance">
<title>Balance</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14213d;--mut:#6b7686;--line:#e2e7ec;--ok:#0f766e;--warn:#b7791f;--bad:#c0392b;--acc:#14213d;--accInk:#fff;--bar2:#cfd8e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#18212f;--ink:#e8edf4;--mut:#93a0b2;--line:#2a3547;--ok:#3cc4b4;--warn:#e0b04f;--bad:#f0746a;--acc:#e8edf4;--accInk:#0f1520;--bar2:#33425a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
h1{font:600 20px/1.2 Georgia,"Times New Roman",serif;margin:0}
select,input,button{font:inherit;color:var(--ink)}
select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#mes{width:auto;font-weight:600}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{border-radius:16px;padding:18px}
.lbl{color:var(--mut);font-size:13px}
.big{font:600 38px/1.1 Georgia,serif;margin:2px 0 4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.row3 b{display:block}
nav{display:flex;gap:6px;margin:14px 0}
.seg{display:flex;gap:6px}
nav button,.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
button[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accInk);font-weight:600;cursor:pointer}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item small{display:block;color:var(--mut)}
.day{font-size:13px;color:var(--mut);margin:12px 0 2px}
.del,.lnk{border:0;background:none;color:var(--mut);cursor:pointer;padding:0 4px}
.lnk{text-decoration:underline;font-size:13px}
.cat{margin:10px 0}.cat em{font-style:normal}
.cat div.bar{height:8px;border-radius:4px;background:var(--bar2);overflow:hidden;margin:3px 0}
.cat div.bar i{display:block;height:100%;background:var(--acc)}
.cat span{display:flex;justify-content:space-between;font-size:14px}
.cat span.lbl{font-size:12px}
.chart{display:flex;gap:10px;align-items:flex-end;height:150px;margin-top:8px;overflow-x:auto}
.col{flex:1;min-width:52px;text-align:center;font-size:12px;color:var(--mut)}
.pair{display:flex;gap:3px;align-items:flex-end;height:120px;justify-content:center}
.pair i{width:14px;border-radius:4px 4px 0 0;display:block}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:6px 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl th{font-weight:500;color:var(--mut);text-align:right;padding:4px 2px}
.tbl td{text-align:right;padding:7px 2px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chips button{flex:none;white-space:nowrap;padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card);cursor:pointer;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:var(--accInk);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.err{color:var(--bad);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<main>
<section id="login" class="card" hidden>
<h1>Balance</h1>
<form id="lf">
<label for="em">Email</label>
<input id="em" type="email" autocomplete="username" required>
<label for="pw">Contraseña</label>
<input id="pw" type="password" autocomplete="current-password" required>
<button class="go" type="submit">Entrar</button>
<p class="err" id="lerr"></p>
</form>
</section>
<div id="app" hidden>
<header><h1>Balance</h1><select id="mes" aria-label="Mes"></select></header>
<section class="hero">
<div class="lbl">Saldo de efectivo</div>
<div class="big" id="saldo"></div>
<div class="lbl"><span class="dot" id="dot"></span><span id="sem"></span></div>
<div class="row3">
<div><span class="lbl">Ingresos</span><b id="ing"></b></div>
<div><span class="lbl">Gastos</span><b id="gas"></b></div>
<div><span class="lbl">Ahorro</span><b id="aho"></b></div>
</div>
</section>
<nav>
<button data-t="add" aria-pressed="true">Añadir</button>
<button data-t="mes" aria-pressed="false">Mes</button>
<button data-t="tot" aria-pressed="false">Totales</button>
</nav>
<section id="add" class="card">
<div class="seg" id="kinds">
<button data-k="g" aria-pressed="true">Gasto</button>
<button data-k="i" aria-pressed="false">Ingreso</button>
<button data-k="s" aria-pressed="false">Ahorro</button>
</div>
<label for="imp">Importe (€)</label>
<input id="imp" inputmode="decimal" placeholder="0,00" autocomplete="off">
<label for="nom">Concepto</label>
<input id="nom" list="dl" autocomplete="off">
<datalist id="dl"></datalist>
<div id="wcat"><label for="cat">Categoría</label><select id="cat"></select></div>
<div id="wfijo"><label for="fijo">Tipo de gasto</label><select id="fijo"><option value="0">Variable</option><option value="1">Fijo</option></select></div>
<div id="wfec"><label for="fec">Fecha</label><input id="fec" type="date"></div>
<button class="go" id="guardar"></button>
<p id="wcancel" style="text-align:center;margin:8px 0 0" hidden><button class="lnk" id="cancel">Cancelar edición</button></p>
</section>
<section id="mes-v" hidden></section>
<section id="tot-v" hidden></section>
<p class="lbl" style="text-align:center"><button class="lnk" id="salir">Cerrar sesión</button></p>
</div>
</main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://jgdipqtaepcozgdofsla.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnZGlwcXRhZXBjb3pnZG9mc2xhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDYwMTMsImV4cCI6MjEwODMyMjAxM30.bSeuKS12IWUjLYoUgSwtNUx8FAr5rWN7hzLIi3rRAzk";
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS=["Comida","Vivienda y suministros","Viajes","Transporte","Cuidado personal","Suscripciones","Ocio y regalos","Deporte","Impuestos"];
const NM=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const $=id=>document.getElementById(id);
const eur=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(n);
const f0=n=>Math.round(n).toLocaleString("es-ES");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lab=k=>NM[+k.slice(5)-1]+" "+k.slice(0,4);
const sh=k=>NM[+k.slice(5)-1].slice(0,3)+" "+k.slice(2,4);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const TY={g:"gasto",i:"ingreso",s:"ahorro"};
const KS={g:["Guardar gasto","Ej.: Comida, gasolina…","Gasto guardado"],i:["Guardar ingreso","Ej.: Nómina","Ingreso guardado"],s:["Guardar ahorro","Ej.: Trade Republic, hucha…","Ahorro guardado"]};
let R=[],cur=today().slice(0,7),tab="add",kind="g",fil="",yr="all",mo="",ed=null;
const rows=(k,t)=>R.filter(x=>x.mes===k&&x.tipo===t);
const sum=a=>a.reduce((t,x)=>t+Number(x.importe),0);
const tot=k=>{const i=sum(rows(k,"ingreso")),g=sum(rows(k,"gasto")),s=sum(rows(k,"ahorro"));return{i,g,s,d:i-g-s}};
const months=()=>{const s=new Set(R.map(x=>x.mes));s.add(cur);return[...s].sort()};
const grp=a=>a.reduce((o,x)=>{const c=x.categoria||"Sin categoría";o[c]=(o[c]||0)+Number(x.importe);return o},{});
const cl=v=>"color:"+(v<0?"var(--bad)":"var(--ok)");
const inMo=k=>mo===""||k.slice(5)===String(+mo+1).padStart(2,"0");
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
async function load(){R=[];for(let p=0;;p++){const {data,error}=await sb.from("movimientos").select("*").order("mes").range(p*1000,p*1000+999);if(error){toast("Error al cargar: "+error.message);break}R=R.concat(data);if(data.length<1000)break}}
function fillMes(){$("mes").innerHTML=months().map(k=>'<option value="'+k+'"'+(k===cur?" selected":"")+'>'+lab(k)+'</option>').join("")}
function fecDef(){const t=today();$("fec").value=t.slice(0,7)===cur?t:cur+"-01"}
function hero(){const t=tot(cur),pc=t.i?t.s/t.i*100:0;
$("saldo").textContent=eur(t.d);$("ing").textContent=eur(t.i);$("gas").textContent=eur(t.g);$("aho").textContent=eur(t.s);
$("dot").style.background=!t.i?"var(--warn)":t.d<0?"var(--bad)":pc>=20?"var(--ok)":pc>=10?"var(--warn)":"var(--bad)";
$("sem").textContent=!t.i?"Añade los ingresos de este mes":t.d<0?"Has gastado más de lo que entra":"Ahorras el "+pc.toFixed(0)+" % de tus ingresos"}
function dl(){$("dl").innerHTML=[...new Set(R.filter(x=>x.tipo===TY[kind]).map(x=>x.concepto))].map(c=>'<option value="'+esc(c)+'">').join("")}
function form(){document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===kind));
["wcat","wfec","wfijo"].forEach(i=>$(i).hidden=kind!=="g");$("guardar").textContent=KS[kind][0];$("nom").placeholder=KS[kind][1];dl()}
function lst(t,ty){const a=rows(cur,ty);let h='<div class="card"><b>'+t+'</b> <span class="lbl">'+eur(sum(a))+'</span>';
if(!a.length)h+='<div class="lbl" style="margin-top:6px">Aún no hay ninguno. Añádelo en la pestaña Añadir.</div>';
a.forEach(x=>{h+='<div class="item"><div>'+esc(x.concepto)+'</div><div>'+eur(x.importe)+' <button class="del" data-e="'+x.id+'" aria-label="Editar">✎</button><button class="del" data-d="'+x.id+'" aria-label="Borrar">✕</button></div></div>'});return h+'</div>'}
function bars(en,A,n){const mc=en.length?en[0][1]:1;return en.map(([c,v])=>'<div class="cat"><span><em>'+esc(c)+'</em><b>'+eur(v)+'</b></span><div class="bar"><i style="width:'+v/mc*100+'%"></i></div><span class="lbl"><em>'+f0(v/n)+' €/mes</em><em>'+(A?(v/A*100).toFixed(0):0)+' %</em></span></div>').join("")}
function vMes(){const e=rows(cur,"gasto"),by=grp(e),tg=sum(e);
if(fil&&!by[fil])fil="";
let h=lst("Ingresos","ingreso")+lst("Ahorros","ahorro");
h+='<div class="chips"><button data-f="" aria-pressed="'+(!fil)+'">Todas</button>';
Object.keys(by).forEach(k=>{h+='<button data-f="'+esc(k)+'" aria-pressed="'+(fil===k)+'">'+esc(k)+'</button>'});
h+='</div><div class="card"><b>Por categoría</b>';
Object.entries(by).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{h+='<div class="cat"><span><em>'+esc(k)+'</em><b>'+eur(v)+'</b></span><div class="bar"><i style="width:'+v/tg*100+'%"></i></div></div>'});
const L=e.filter(x=>!fil||(x.categoria||"Sin categoría")===fil).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
h+='</div><div class="card"><b>'+esc(fil||"Gastos del mes")+'</b> <span class="lbl">'+eur(sum(L))+'</span>';
let last=null;
L.forEach(x=>{if(x.fecha!==last){last=x.fecha;h+='<div class="day">'+(x.fecha?new Date(x.fecha+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}):"Sin día concreto")+'</div>'}
h+='<div class="item"><div>'+esc(x.concepto)+'<small>'+esc(x.categoria||"Sin categoría")+(x.fijo===true?", fijo":x.fijo===false?", variable":"")+'</small></div><div>'+eur(x.importe)+' <button class="del" data-e="'+x.id+'" aria-label="Editar">✎</button><button class="del" data-d="'+x.id+'" aria-label="Borrar">✕</button></div></div>'});
$("mes-v").innerHTML=h+'</div>'}
function filtros(){const ys=[...new Set(months().map(k=>k.slice(0,4)))].sort().reverse();let h='<div class="chips">';
[["all","Todos"],...ys.map(y=>[y,y]),["cmp","Comparar años"]].forEach(([v,t])=>{h+='<button data-y="'+v+'" aria-pressed="'+(yr===v)+'">'+t+'</button>'});
return h+'</div><select id="fmo" aria-label="Mes" style="margin-bottom:12px"><option value="">Todos los meses</option>'+NM.map((m,i)=>'<option value="'+i+'"'+(mo===String(i)?" selected":"")+'>'+m+'</option>').join("")+'</select>'}
function pills(ks){if(!ks.length)return"";const S=new Set(ks),T=ks.map(tot),E=R.filter(x=>x.tipo==="gasto"&&S.has(x.mes)),by=grp(E),n=T.filter(t=>t.i>0).length||1;
const I=sum(T.map(t=>({importe:t.i}))),Sv=sum(T.map(t=>({importe:t.s}))),G=sum(E),fx=sum(E.filter(x=>x.fijo===true)),
top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0],mx=T.indexOf(T.reduce((a,t)=>t.g>a.g?t:a)),L=[];
if(top)L.push(top[0]+" es tu mayor gasto: "+(top[1]/G*100).toFixed(0)+" % del total.");
if(I)L.push("Ahorras el "+(Sv/I*100).toFixed(0)+" % de tus ingresos. Una referencia habitual es el 20 %.");
if(G&&fx)L.push("El "+(fx/G*100).toFixed(0)+" % de tu gasto es fijo, unos "+f0(fx/n)+" € al mes. Es lo que menos se mueve: revisa cuotas y suscripciones antes de recortar el resto.");
if(T.length>1)L.push(lab(ks[mx])+" fue el mes con más gasto: "+eur(T[mx].g)+".");
return '<div class="card"><b>Píldoras</b>'+L.map(t=>'<p style="margin:8px 0 0">'+t+'</p>').join("")+'</div>'}
function vTotal(ks){if(!ks.length)return'<div class="card lbl">No hay datos para este filtro.</div>';
const S=new Set(ks),T=ks.map(tot),n=T.filter(t=>t.i>0).length||1;
const A=T.reduce((a,t)=>({i:a.i+t.i,g:a.g+t.g,s:a.s+t.s,d:a.d+t.d}),{i:0,g:0,s:0,d:0});
const row=(l,t,b)=>'<tr'+(b?' style="font-weight:600"':'')+'><td>'+l+'</td><td>'+f0(t.i)+'</td><td>'+f0(t.g)+'</td><td>'+f0(t.s)+'</td><td style="'+cl(t.d)+'">'+f0(t.d)+'</td></tr>';
let h='<div class="card"><b>Totales por mes</b> <span class="lbl">en €</span><table class="tbl"><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Ahorro</th><th>Saldo</th></tr>';
ks.forEach((k,j)=>{h+=row(sh(k),T[j])});
h+=row("Total",A,1)+row("Media/mes",{i:A.i/n,g:A.g/n,s:A.s/n,d:A.d/n})+'</table></div>';
const mx=Math.max(...T.map(t=>Math.max(t.i,t.g,t.s)),1);
h+='<div class="card"><b>Ingresos, gastos y ahorro</b><div class="leg"><span><i style="background:var(--bar2)"></i>Ingresos</span><span><i style="background:var(--acc)"></i>Gastos</span><span><i style="background:var(--ok)"></i>Ahorro</span></div><div class="chart">';
ks.forEach((k,j)=>{const t=T[j];h+='<div class="col"><div class="pair">'+[[t.i,"var(--bar2)"],[t.g,"var(--acc)"],[t.s,"var(--ok)"]].map(([v,c])=>'<i style="height:'+v/mx*100+'%;background:'+c+'"></i>').join("")+'</div>'+sh(k)+'</div>'});
h+='</div></div>';
const ms=Math.max(...T.map(t=>Math.abs(t.d)),1),bw=300/ks.length;
h+='<div class="card"><b>Saldo de efectivo</b><svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Saldo por mes"><line x1="0" x2="300" y1="55" y2="55" style="stroke:var(--line)"/>'+T.map((t,j)=>{const hh=Math.abs(t.d)/ms*50;return '<rect x="'+(j*bw+bw*.25)+'" y="'+(t.d>=0?55-hh:55)+'" width="'+bw*.5+'" height="'+hh+'" rx="3" style="fill:'+(t.d<0?"var(--bad)":"var(--ok)")+'"/><text x="'+(j*bw+bw/2)+'" y="125" text-anchor="middle" font-size="8" style="fill:var(--mut)">'+NM[+ks[j].slice(5)-1].slice(0,3)+'</text>'}).join("")+'</svg></div>';
const E=R.filter(x=>x.tipo==="gasto"&&S.has(x.mes)),G=sum(E);
const fv=[["Fijos",sum(E.filter(x=>x.fijo===true))],["Variables",sum(E.filter(x=>x.fijo===false))],["Sin clasificar",sum(E.filter(x=>x.fijo==null))]].filter(x=>x[1]>0);
h+='<div class="card"><b>Fijos y variables</b>'+bars(fv,G,n)+'</div>';
h+='<div class="card"><b>Gasto por categoría</b> <span class="lbl">acumulado, €/mes y %</span>'+bars(Object.entries(grp(E)).sort((a,b)=>b[1]-a[1]),G,n)+'</div>';
return h}
function vCmp(){const all=[...new Set(months().map(k=>k.slice(0,4)))].sort().slice(-2);
if(all.length<2)return filtros()+'<div class="card lbl">Necesitas datos de dos años para comparar.</div>';
const S=all.map(y=>{const ks=months().filter(k=>k.startsWith(y)&&inMo(k)),T=ks.map(tot),E=R.filter(x=>x.tipo==="gasto"&&ks.includes(x.mes));
return{y,by:grp(E),n:T.filter(t=>t.i>0).length||1,A:T.reduce((a,t)=>({i:a.i+t.i,g:a.g+t.g,s:a.s+t.s,d:a.d+t.d}),{i:0,g:0,s:0,d:0})}});
const [P,Q]=S,vr=(x,y)=>x?((y>x?"+":"")+((y-x)/x*100).toFixed(0)+" %"):"–";
let h=filtros()+'<div class="card"><b>Media al mes</b> <span class="lbl">en €</span><table class="tbl"><tr><th></th><th>'+P.y+'</th><th>'+Q.y+'</th><th>Var.</th></tr>';
[["Ingresos","i"],["Gastos","g"],["Ahorro","s"],["Saldo","d"]].forEach(([t,k])=>{const x=P.A[k]/P.n,y=Q.A[k]/Q.n;h+='<tr><td>'+t+'</td><td>'+f0(x)+'</td><td>'+f0(y)+'</td><td style="'+cl(k==="g"?x-y:y-x)+'">'+vr(x,y)+'</td></tr>'});
const gm=(y,m)=>sum(rows(y+"-"+String(m+1).padStart(2,"0"),"gasto")),mx=Math.max(1,...all.flatMap(y=>NM.map((_,m)=>gm(y,m))));
h+='</table></div><div class="card"><b>Gastos mes a mes</b><div class="leg"><span><i style="background:var(--bar2)"></i>'+P.y+'</span><span><i style="background:var(--acc)"></i>'+Q.y+'</span></div><div class="chart">';
NM.forEach((n,m)=>{if(mo!==""&&String(m)!==mo)return;h+='<div class="col"><div class="pair">'+[[gm(P.y,m),"var(--bar2)"],[gm(Q.y,m),"var(--acc)"]].map(([v,c])=>'<i style="height:'+v/mx*100+'%;background:'+c+'"></i>').join("")+'</div>'+n.slice(0,3)+'</div>'});
const cs=[...new Set([...Object.keys(P.by),...Object.keys(Q.by)])].sort((x,y)=>(Q.by[y]||0)/Q.n-(Q.by[x]||0)/Q.n);
h+='</div></div><div class="card"><b>Categorías</b> <span class="lbl">€/mes</span><table class="tbl"><tr><th></th><th>'+P.y+'</th><th>'+Q.y+'</th><th>Var.</th></tr>';
cs.forEach(c=>{const x=(P.by[c]||0)/P.n,y=(Q.by[c]||0)/Q.n;h+='<tr><td>'+esc(c)+'</td><td>'+f0(x)+'</td><td>'+f0(y)+'</td><td style="'+cl(x-y)+'">'+vr(x,y)+'</td></tr>'});
return h+'</table></div>'}
function vTot(){const ks=months().filter(k=>(yr==="all"||k.startsWith(yr))&&inMo(k));
$("tot-v").innerHTML=yr==="cmp"?vCmp():filtros()+pills(ks)+vTotal(ks)}
function show(){$("add").hidden=tab!=="add";$("mes-v").hidden=tab!=="mes";$("tot-v").hidden=tab!=="tot";
document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===tab));
hero();if(tab==="mes")vMes();if(tab==="tot")vTot()}
async function del(id){if(!confirm("¿Borrar este movimiento?"))return;const {error}=await sb.from("movimientos").delete().eq("id",id);if(error){toast("Error: "+error.message);return}R=R.filter(x=>x.id!==id);show()}
function startEdit(id){const x=R.find(r=>r.id===id);if(!x)return;ed=x;kind=Object.keys(TY).find(k=>TY[k]===x.tipo);tab="add";
$("imp").value=String(x.importe).replace(".",",");$("nom").value=x.concepto;
if(kind==="g"){$("cat").value=x.categoria||CATS[0];$("fijo").value=x.fijo?"1":"0";$("fec").value=x.fecha||""}
form();$("guardar").textContent="Guardar cambios";$("kinds").hidden=true;$("wcancel").hidden=false;show();window.scrollTo(0,0)}
function endEdit(){ed=null;$("kinds").hidden=false;$("wcancel").hidden=true;$("imp").value="";$("nom").value="";fecDef();form()}
async function start(){$("login").hidden=true;$("app").hidden=false;await load();fillMes();fecDef();form();show()}
function showLogin(){$("app").hidden=true;$("login").hidden=false}
CATS.forEach(c=>$("cat").add(new Option(c,c)));
$("mes").onchange=e=>{cur=e.target.value;fil="";if(ed)endEdit();fecDef();show()};
document.querySelector("nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;show()}};
$("kinds").onclick=e=>{if(e.target.dataset.k){kind=e.target.dataset.k;form()}};
$("nom").oninput=()=>{if(kind!=="g")return;const v=$("nom").value.trim().toLowerCase(),m=R.slice().reverse().find(x=>x.tipo==="gasto"&&x.concepto.toLowerCase()===v);if(m){if(m.categoria)$("cat").value=m.categoria;if(m.fijo!=null)$("fijo").value=m.fijo?"1":"0"}};
$("guardar").onclick=async()=>{const v=parseFloat($("imp").value.replace(",","."));
if(!(v>0)){toast("Escribe un importe válido");return}
const n=$("nom").value.trim(),c=kind==="g"?$("cat").value:kind==="i"?"Nómina":"Ahorro",row={mes:cur,tipo:TY[kind],concepto:n||c,importe:v,categoria:c};
if(kind==="g"){row.fecha=$("fec").value||null;row.fijo=$("fijo").value==="1"}
$("guardar").disabled=true;
const {data,error}=await(ed?sb.from("movimientos").update(row).eq("id",ed.id).select().single():sb.from("movimientos").insert(row).select().single());
$("guardar").disabled=false;
if(error){toast("Error: "+error.message);return}
if(ed){R=R.map(x=>x.id===ed.id?data:x);endEdit();tab="mes";show();toast("Cambios guardados");return}
R.push(data);$("imp").value="";$("nom").value="";dl();hero();toast(KS[kind][2])};
$("mes-v").onclick=e=>{const d=e.target.dataset;if(d.f!==undefined){fil=d.f;show();return}if(d.e){startEdit(d.e);return}if(d.d)del(d.d)};
$("cancel").onclick=()=>{endEdit();show()};
$("tot-v").onclick=e=>{if(e.target.dataset.y){yr=e.target.dataset.y;show()}};
$("tot-v").onchange=e=>{if(e.target.id==="fmo"){mo=e.target.value;show()}};
$("lf").onsubmit=async e=>{e.preventDefault();$("lerr").textContent="";
const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
if(error){$("lerr").textContent="No se pudo entrar: "+error.message;return}start()};
$("salir").onclick=async()=>{await sb.auth.signOut();R=[];showLogin()};
(async()=>{const {data}=await sb.auth.getSession();data.session?start():showLogin()})();
</script>
